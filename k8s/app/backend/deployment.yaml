apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa

      containers:
        - name: backend
          image: 905179308072.dkr.ecr.ap-south-1.amazonaws.com/file-storage-backend:latest

          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: AWS_REGION
              value: "ap-south-1"

            - name: S3_BUCKET
              value: "file-storage-dev-bucket"

          envFrom:
            - secretRef:
                name: db-secret

            - secretRef:
                name: redis-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"