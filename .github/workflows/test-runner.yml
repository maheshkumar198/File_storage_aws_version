name: Test Self Hosted Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    

jobs:

  test-runner:
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Run Tests
        working-directory: backend
        run: npm run test:coverage

      - name: NPM Audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true
      
      - name: Build Docker Image
        run: |
          docker build \
            -t my-backend-image:latest \
            backend/

      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master 
        with:
          scan-type: image
          scan-ref: my-backend-image:latest
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true